<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d32f2f">
  <title>Convite Especial ❤️</title>
  <meta name="description" content="Um convite especial pra você ❤️">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      overflow: hidden;
    }

    .phone {
      position: relative;
      width: min(360px, 100%);
      height: min(720px, calc(100vh - 40px));
      min-height: 620px;
      overflow: hidden;
      border: 8px solid #222;
      border-radius: 42px;
      background: linear-gradient(180deg, #d32f2f 0%, #8e0000 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .65);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 50%;
      width: 120px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #222;
    }

    .hearts {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      opacity: .8;
      animation: float 5s linear infinite;
    }

    .heart:nth-child(1) {
      left: 8%;
      top: 85%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 75%;
      top: 75%;
      animation-delay: 1s;
    }

    .heart:nth-child(3) {
      left: 18%;
      top: 45%;
      animation-delay: 2s;
    }

    .heart:nth-child(4) {
      left: 82%;
      top: 35%;
      animation-delay: 3s;
    }

    .heart:nth-child(5) {
      left: 50%;
      top: 90%;
      animation-delay: 1.5s;
    }

    .heart:nth-child(6) {
      left: 65%;
      top: 15%;
      animation-delay: 2.5s;
    }

    @keyframes float {
      0% {
        transform: translateY(40px) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: .8;
      }

      100% {
        transform: translateY(-180px) rotate(20deg);
        opacity: 0;
      }
    }

    .screen {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px 20px;
      color: #fff;
      text-align: center;
    }

    .step {
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      animation: enter .35s ease;
    }

    .step::-webkit-scrollbar {
      display: none;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateX(15px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .emoji {
      font-size: 78px;
      line-height: 1;
      margin-bottom: 20px;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .25));
    }

    h1 {
      font-size: 1.8rem;
      line-height: 1.15;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: 900;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 18px;
      text-transform: uppercase;
      font-weight: 800;
    }

    p {
      line-height: 1.45;
    }

    .card {
      width: 100%;
      padding: 22px 18px;
      border-radius: 22px;
      background: rgba(90, 0, 0, .68);
      box-shadow: 0 10px 25px rgba(0, 0, 0, .25);
      backdrop-filter: blur(5px);
    }

    .subtitle {
      margin-bottom: 18px;
      font-size: .95rem;
      opacity: .95;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px 22px;
      margin: 18px 0 20px;
    }

    .detail {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: .95rem;
    }

    .foto {
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: 65% 35%;
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 28px;
      padding: 13px 24px;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    button:active {
      transform: scale(.95);
    }

    .primary {
      color: #d32f2f;
      background: #fff;
      box-shadow: 0 5px 14px rgba(0, 0, 0, .25);
    }

    .secondary {
      color: #fff;
      background: #ef3c3c;
      box-shadow: 0 5px 14px rgba(0, 0, 0, .22);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .choice {
      padding: 12px 6px;
      min-height: 72px;
      color: #fff;
      background: rgba(70, 0, 0, .7);
      border: 2px solid rgba(255, 255, 255, .12);
      border-radius: 15px;
      font-size: .82rem;
      box-shadow: none;
    }

    .choice span {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .choice.selected {
      background: #fff;
      color: #d32f2f;
      border-color: #fff;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid rgba(255, 255, 255, .2);
      border-radius: 25px;
      outline: none;
      color: #fff;
      background: rgba(70, 0, 0, .75);
      font: inherit;
      font-size: .85rem;
      text-align: center;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, .6);
    }

    .message {
      margin-top: 15px;
      font-size: .9rem;
      opacity: .9;
      min-height: 22px;
    }

    .success {
      font-size: 72px;
      margin-bottom: 15px;
    }

    .summary {
      margin: 18px 0;
      padding: 15px;
      border-radius: 18px;
      background: rgba(70, 0, 0, .6);
      line-height: 1.7;
    }

    .small {
      margin-top: 15px;
      font-size: .78rem;
      opacity: .75;
    }

    @media (max-height: 680px) {
      .phone {
        height: calc(100vh - 20px);
        min-height: 0;
      }

      .screen {
        padding-top: 28px;
      }

      .emoji {
        font-size: 58px;
      }

      .foto {
        width: 110px;
        height: 110px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="phone">

    <div class="hearts" aria-hidden="true">
      <span class="heart">❤️</span>
      <span class="heart">💗</span>
      <span class="heart">❤️</span>
      <span class="heart">💖</span>
      <span class="heart">❤️</span>
      <span class="heart">💗</span>
    </div>

    <section class="screen" id="app"></section>

  </main>

  <script>

    // =========================
    // PERSONALIZE AQUI
    // =========================

    const convite = {
      data: "26/09",
      horario: "19:00"
    };


    // =========================
    // ESTADO DO CONVITE
    // =========================

    const state = {
      step: 1,
      vibe: "",
      sugestao: "",
      lugar: ""
    };


    // =========================
    // OPÇÕES DE VIBE
    // =========================

    const vibes = [
      { id: "cinema-lanche", emoji: "🎬🍔🌙", nome: "Cinema, lanche e motel" }
    ];


    const app = document.getElementById("app");


    // =========================
    // RENDERIZA A TELA
    // =========================

    function render() {

      const screens = {
        1: screenWelcome,
        2: screenAnswer,
        3: screenVibe,
        4: screenFinal,
        5: screenEnviado
      };

      app.innerHTML = screens[state.step]();

      bindEvents();
    }


    // =========================
    // TELA 1
    // =========================

    function screenWelcome() {

      return `

        <div class="step">

          <img
            class="foto"
            src="foto.jpg"
            alt="Beth"
          >

          <div class="card">

            <h1>
              Vamos sair?
            </h1>

            <p class="subtitle">
              A gente se encontra em algum ponto perto de você, sem complicação. 😉
            </p>

            <div class="details">

              <div class="detail">
                📅
                <strong>
                  ${convite.data}
                </strong>
              </div>

              <div class="detail">
                🕖
                <strong>
                  ${convite.horario}
                </strong>
              </div>

            </div>

            <button
              class="primary"
              data-action="start"
            >
              Continuar ❤️
            </button>

          </div>

        </div>

      `;
    }


    // =========================
    // TELA 2
    // =========================

    function screenAnswer() {

      return `

        <div class="step">

          <div class="emoji">
            🥺
          </div>

          <div class="card">

            <h2>
              Você aceitaria ir a<br>
              um date comigo, Beth?
            </h2>

            <div class="buttons">

              <button
                class="primary"
                data-action="yes"
              >
                SIM ❤️
              </button>

              <button
                class="secondary"
                data-action="no"
              >
                NÃO
              </button>

            </div>

            <p
              class="message"
              id="message"
            ></p>

          </div>

        </div>

      `;
    }


    // =========================
    // TELA 4
    // =========================

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[c]));
    }


    function screenVibe() {

      return `

        <div class="step">

          <div class="emoji">
            🥰
          </div>

          <div class="card">

            <h2>
              Alguma sugestão? 💡
            </h2>

            <p class="subtitle">
              Esse é o plano, mas pode sugerir o que quiser
            </p>

            <div class="choice-grid">

              ${vibes.map(v => `

                <button
                  class="choice ${state.vibe === v.id ? "selected" : ""}"
                  data-vibe="${v.id}"
                >

                  <span>
                    ${v.emoji}
                  </span>

                  ${v.nome}

                </button>

              `).join("")}

            </div>

            <input
              id="sugestao"
              type="text"
              maxlength="80"
              placeholder="Ou sugere outra ideia..."
              value="${escapeHtml(state.sugestao)}"
              style="margin-top:14px;"
            >

            <button
              class="primary"
              data-action="vibe"
              style="margin-top:20px;"
            >
              ISSO PARECE LEGAL! 😎
            </button>

            <p
              class="message"
              id="message"
            ></p>

          </div>

        </div>

      `;
    }


    /* =========================================
   NOVA TELA FINAL
   ========================================= */

function screenFinal() {

  const selected =
    vibes.find(v => v.id === state.vibe);

  return `

    <div class="step">

      <div class="success">
        🌹😏
      </div>

      <div class="card">

        <h2>
          Você disse SIM! 😏
        </h2>

        <div class="summary">

          📅
          <strong>
            ${convite.data}
          </strong>

          <br>

          🕐
          <strong>
            ${convite.horario}
          </strong>

          <br>

          ${
            selected
              ? `${selected.emoji} <strong>${selected.nome}</strong>`
              : ""
          }

          ${
            state.sugestao
              ? `<br>💡 <strong>${escapeHtml(state.sugestao)}</strong>`
              : ""
          }

        </div>

        <input
          id="lugar"
          type="text"
          maxlength="80"
          placeholder="📍 Sugere um lugar perto de você"
          value="${escapeHtml(state.lugar)}"
          style="margin-bottom:14px;"
        >

        <button
          class="primary"
          data-action="send"
        >
          ENVIAR ❤️
        </button>

        <p
          class="message"
          id="message"
        ></p>

      </div>

    </div>

  `;
}


/* =========================================
   TELA DE ENVIADO
   ========================================= */

function screenEnviado() {

  return `

    <div class="step">

      <div class="success">
        💌
      </div>

      <div class="card">

        <h2>
          Enviado! 😉
        </h2>

        <p class="small">
          Já recebi tudo. Agora é só combinar os detalhes.
        </p>

      </div>

    </div>

  `;
}


/* =========================================
   ENVIO POR E-MAIL
   ========================================= */

const EMAIL_DESTINO = "mateus.dpaula10@gmail.com";

async function enviarEscolhas(button) {

  const message =
    document.getElementById("message");

  const selected =
    vibes.find(v => v.id === state.vibe);

  button.disabled = true;

  message.textContent = "Enviando... 💌";

  try {

    const response = await fetch(
      "https://formsubmit.co/ajax/" + EMAIL_DESTINO,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: "Beth respondeu o convite ❤️",
          _captcha: "false",
          _template: "table",
          Resposta: "SIM",
          Data: convite.data,
          Horario: convite.horario,
          Combo: selected ? selected.nome : "(não escolheu)",
          Sugestao: state.sugestao || "(nenhuma)",
          Lugar_perto_dela: state.lugar || "(nenhum)"
        })
      }
    );

    const result = await response.json();

    if (!response.ok || String(result.success) !== "true") {
      throw new Error(result.message || "falha no envio");
    }

    state.step = 5;

    render();

  } catch (error) {

    button.disabled = false;

    message.textContent =
      "Não consegui enviar 😕 tenta de novo!";

  }
}


/* =========================================
   ATUALIZA OS BOTÕES
   ========================================= */

function bindEvents() {

  // Seleção da atividade
  document
    .querySelectorAll("[data-vibe]")
    .forEach(button => {

      button.addEventListener("click", () => {

        state.vibe =
          button.dataset.vibe;

        render();

      });

    });


  // Sugestão digitada
  const sugestao = document.getElementById("sugestao");

  if (sugestao) {
    sugestao.addEventListener("input", () => {
      state.sugestao = sugestao.value.trim();
    });
  }


  const lugar = document.getElementById("lugar");

  if (lugar) {
    lugar.addEventListener("input", () => {
      state.lugar = lugar.value.trim();
    });
  }


  // Botões das telas
  document
    .querySelectorAll("[data-action]")
    .forEach(button => {

      button.addEventListener("click", () => {

        const action =
          button.dataset.action;


        // CONTINUAR
        if (action === "start") {

          state.step = 2;

          render();

        }


        // SIM
        if (action === "yes") {

          state.step = 3;

          render();

        }


        // NÃO
        if (action === "no") {

          const message =
            document.getElementById("message");

          if (message) {

            message.textContent =
              "Aí você me quebra 😂 tenta de novo!";

          }

        }


                // VIBE
        if (action === "vibe") {

          if (!state.vibe && !state.sugestao) {

            document.getElementById(
              "message"
            ).textContent =
              "Escolhe o combo ou sugere algo 😏";

            return;

          }

          state.step = 4;

          render();

        }


        // ENVIAR
        if (action === "send") {

          enviarEscolhas(button);

        }

      });

    });

}


/* =========================================
   ATUALIZA A PÁGINA
   ========================================= */

render();
  </script>

</body>
</html>
